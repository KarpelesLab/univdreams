[workspace]
resolver = "2"
members = [
    "crates/ud-core",
    "crates/ud-format-elf",
    "crates/ud-arch-x86",
    "crates/ud-cli",
]

# Additional member crates land in later phases:
#   crates/ud-arch         (Phase 1+: arch trait, once a second arch arrives)
#   crates/ud-ir           (Phase 2: IR types)
#   crates/ud-analysis     (Phase 2: function discovery, type recovery, sig matching)
#   crates/ud-debug        (Phase 5: DWARF/PDB)
#   crates/ud-signatures   (Phase 5: stdlib signature DB)
#   crates/ud-decompile    (Phase 3: IR → AST → .ud)
#   crates/ud-compile      (Phase 3: .ud → AST → IR → bytes)
#
# See docs/architecture.md for the role of each crate and docs/roadmap.md for
# the order they come online.

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/KarpelesLab/univdreams"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
# Documentation lints are revisited once the public surface stabilises.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
# Binary-format spec field names are deliberately similar (e_phoff/e_phnum,
# sh_offset/sh_size, etc.). Renaming them to please clippy makes the code
# diverge from the spec.
similar_names = "allow"

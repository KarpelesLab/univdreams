[package]
name = "univdreams"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Byte-identical binary <-> source round-tripping: binary formats, multi-arch decode/encode, a .ud decompiler/compiler, and an x86 emulator with Win16/Win32/Linux hosts."
license = "MIT"
repository = "https://github.com/KarpelesLab/univdreams"
homepage = "https://github.com/KarpelesLab/univdreams"
authors = ["Mark Karpeles"]
keywords = ["decompiler", "compiler", "binary-analysis", "reverse-engineering", "emulator"]
categories = ["development-tools", "command-line-utilities", "emulators"]
readme = "README.md"
exclude = ["/testdata", "/site", "/docs", "/.github"]

[features]
default = ["cli"]
# The `ud` command-line driver (and the `cli` module it is built on).
cli = ["dep:clap", "dep:anyhow", "dep:serde_json", "dep:ureq", "dep:bs58", "dep:base64", "dep:libc"]
# `ud script`: drive the sandbox from JavaScript (kataan engine).
script = ["cli", "dep:kataan"]
# wasm-bindgen bindings for the browser playground (`wasm` module).
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:bs58"]
# Emulator: reverse-engineering instrumentation (stub-call / watchpoint traces).
trace = []
trace-exec = ["trace"]
# Emulator: run Linux guests under KVM (Linux hosts only).
kvm = ["dep:libc", "dep:kvm-ioctls", "dep:kvm-bindings"]
# Emulator: real-filesystem mount backends (ext4 / NTFS / FAT images) via fstool.
fstool = ["dep:fstool"]

[package.metadata.docs.rs]
features = ["trace", "trace-exec", "wasm"]

[[bin]]
name = "ud"
path = "src/bin/ud/main.rs"
required-features = ["cli"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1", default-features = false, features = [
    "decoder",
    "encoder",
    "block_encoder",
    "instr_info",
    "intel",
    "std",
] }
# Read MSI compound-document tables / CAB archives for the emulator's msiexec.
msi = "0.10"
cab = "0.6"
# cli
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
bs58 = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }
kataan = { version = "0.0.7", optional = true, default-features = false, features = [
    "std",
    "host",
    "module",
] }
# wasm
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# kvm
kvm-ioctls = { version = "0.23", optional = true }
kvm-bindings = { version = "0.13", optional = true, features = ["fam-wrappers"] }
# fstool
fstool = { version = "0.4.35", optional = true, default-features = false, features = [
    # Since 0.4.35 the filesystem backends are opt-in; `filesystems` restores
    # the full set (ext4 for --rootfs, NTFS/FAT/… for --mount images).
    "filesystems",
    "gzip",
] }

[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[[example]]
name = "cook_r12"
required-features = ["trace"]

[[example]]
name = "cook_r13"
required-features = ["trace"]

[[example]]
name = "round27_msmpeg4_watch"
required-features = ["trace"]

[[example]]
name = "vp6_sbx"
required-features = ["trace"]

[[example]]
name = "lagarith_r56"
required-features = ["trace"]

[[example]]
name = "msmpeg4_r30_encode_seq"
required-features = ["trace"]

[[example]]
name = "wma_r10_lsp"
required-features = ["trace"]

[[test]]
name = "re2_indeo5_dequant"
required-features = ["trace"]

[[test]]
name = "re2_indeo5_r18"
required-features = ["trace"]

[[test]]
name = "re2_indeo3_r21"
required-features = ["trace"]

[[test]]
name = "round8_svq3_qtx_filter"
required-features = ["trace"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
# Documentation lints are revisited once the public surface stabilises.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
# New in clippy 1.99: `assert!(x.is_empty())` reads better than the suggested
# `assert_eq!(x, [] as [T; 0])` in our tests.
assert_is_empty = "allow"
# Binary-format spec field names are deliberately similar (e_phoff/e_phnum,
# sh_offset/sh_size, etc.). Renaming them to please clippy makes the code
# diverge from the spec.
similar_names = "allow"

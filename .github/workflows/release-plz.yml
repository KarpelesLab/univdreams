name: release-plz

# Both jobs authenticate with the organisation's `RELEASE_PLZ_TOKEN` PAT rather
# than the default `GITHUB_TOKEN`. GitHub does not trigger workflows from events
# created by `GITHUB_TOKEN` -- it is how recursive runs are prevented -- so a
# release PR opened with it gets no CI until somebody approves each run by hand,
# and a tag pushed with it fires no tag-triggered workflow.

on:
  push:
    branches: [master]

# Don't run two release jobs concurrently — release-plz mutates
# the repo (release PRs, tags) and crates.io.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Open / update a release PR that bumps the workspace version
  # and refreshes CHANGELOG.md based on the conventional commits
  # since the last tag. Merge the PR to trigger the publish job.
  release-pr:
    name: release-plz release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # release-plz pushes the version-bump commit and tag over git, so the
          # PAT has to be persisted on the checkout, not only handed to the
          # action's API calls.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish every workspace member to crates.io after the release
  # PR is merged. The action skips this step until a release-PR
  # merge produces a new tag.
  release:
    name: release-plz publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # release-plz pushes the version-bump commit and tag over git, so the
          # PAT has to be persisted on the checkout, not only handed to the
          # action's API calls.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

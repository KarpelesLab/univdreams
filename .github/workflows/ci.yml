name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` fetches the binary fixtures under testdata/ so the
      # round-trip integration test runs against real bytes, not a no-op.
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    # Mirror what docs.rs builds: public API only (no private items),
    # with broken intra-doc links promoted to hard errors so the
    # published docs never ship a dangling `[link]`.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  script-feature:
    name: script feature (kataan)
    runs-on: ubuntu-latest
    # The `script` feature pulls the `kataan` JS engine (edition 2024,
    # Rust >= 1.88) and isn't built by the default clippy/test jobs, so
    # lint + test it on its own.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ud-cli --features script --all-targets -- -D warnings
      - run: cargo test -p ud-cli --features script

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` fetches the binary fixtures under testdata/ so the
      # round-trip integration test runs against real bytes, not a no-op.
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    # Mirror what docs.rs builds: public API only (no private items),
    # with broken intra-doc links promoted to hard errors so the
    # published docs never ship a dangling `[link]`.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features wasm,trace-exec

  script-feature:
    name: script feature (kataan)
    runs-on: ubuntu-latest
    # The `script` feature pulls the `kataan` JS engine; the clippy job
    # lints it (--all-features) but the default test job doesn't run it.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features script

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    # Keep this pin in sync with `rust-version` in Cargo.toml. Compile-only:
    # guards against using a std/library or language feature newer than the
    # declared minimum (behaviour is covered by the stable `test` job).
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --all-features

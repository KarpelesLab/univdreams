[package]
name = "ud-arch-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Arch-codec trait + open registry: the shared interface every univdreams arch backend implements so the compile/decompile pipeline can dispatch generically."

[lints]
workspace = true

[dependencies]
thiserror = "2"

[dev-dependencies]
# Path-only — these arches depend on ud-arch-codec so a
# version= constraint would create a publish-time cycle.
# Dev-deps without a version are excluded from the published
# manifest (they're only needed when building this crate's
# own tests in-tree).
ud-arch-x86 = { path = "../ud-arch-x86" }
ud-arch-bpf = { path = "../ud-arch-bpf" }
ud-arch-aarch64 = { path = "../ud-arch-aarch64" }
ud-arch-6502 = { path = "../ud-arch-6502" }

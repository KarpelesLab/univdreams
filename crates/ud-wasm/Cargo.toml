[package]
name = "ud-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen wrapper exposing univdreams decompile/compile to a browser playground."
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
ud-ast = { path = "../ud-ast" }
ud-format-elf = { path = "../ud-format-elf" }
ud-format-pe = { path = "../ud-format-pe" }
ud-format-macho = { path = "../ud-format-macho" }
ud-format-raw = { path = "../ud-format-raw" }
ud-decompile = { path = "../ud-decompile" }
ud-compile = { path = "../ud-compile" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

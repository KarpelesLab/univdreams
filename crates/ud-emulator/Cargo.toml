[package]
name = "ud-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure-Rust 32-bit x86 emulator + PE runtime loader + Win32 host shims. Mirrors oxideav-vfw; intended to grow into the dynamic-analysis backend that informs decompilation (indirect-target recovery, constant-data discovery)."

[lints]
workspace = true

[features]
default = []

# Trace mode — adds reverse-engineering instrumentation surface
# (Win32 stub calls, memory watchpoints, traps) that emits JSONL
# events. Off by default; consumers do not pay for the probe-site
# branches.
trace = []

# Per-instruction execution trace inside `trace` mode. Imposes
# ~3× extra overhead on top of `trace`. Has no effect unless
# `trace` is also enabled.
trace-exec = ["trace"]

# docs.rs builds with `trace` + `trace-exec` enabled so the
# trace-gated public items resolve in the rendered docs.
[package.metadata.docs.rs]
features = ["trace", "trace-exec"]

[dependencies]
thiserror = "2"
# Read MSI compound-document tables for the in-emulator
# msiexec implementation under `win32::msiexec`. Read-only
# (open() takes Read+Seek; we feed it Cursor<&[u8]> over VFS
# bytes).
msi = "0.10"
# Decompress Windows .cab archives (LZX / MSZIP). The MSI's
# embedded `#name.cab` streams carry the actual file bodies
# that the install would write under Program Files; we pump
# the decompressed bytes through `win32::msiexec`'s
# WriteFile actions so the VFS dump has real content rather
# than zero-byte placeholders.
cab = "0.6"

[dev-dependencies]
# Fetched-fixture corpus runner (`tests/codec_corpus.rs`).
# Pulls codec DLLs from samples.oxideav.org with a local cache.
ureq = { version = "2", default-features = false, features = ["tls"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

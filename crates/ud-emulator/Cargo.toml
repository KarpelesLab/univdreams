[package]
name = "ud-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure-Rust 32-bit x86 emulator + PE runtime loader + Win32 host shims. Mirrors oxideav-vfw; intended to grow into the dynamic-analysis backend that informs decompilation (indirect-target recovery, constant-data discovery)."

[lints]
workspace = true

[features]
default = []

# Trace mode — adds reverse-engineering instrumentation surface
# (Win32 stub calls, memory watchpoints, traps) that emits JSONL
# events. Off by default; consumers do not pay for the probe-site
# branches.
trace = []

# Per-instruction execution trace inside `trace` mode. Imposes
# ~3× extra overhead on top of `trace`. Has no effect unless
# `trace` is also enabled.
trace-exec = ["trace"]

# Opt-in KVM acceleration backend for the Linux personality (x86-64 guests
# on a Linux x86-64 host with /dev/kvm). Off by default so the pure-software
# interpreter stays the portable, dependency-light path; enabling `kvm` pulls
# in the rust-vmm ioctl wrappers + libc for the guest-memory mmap.
kvm = ["dep:libc", "dep:kvm-ioctls", "dep:kvm-bindings"]

# Opt-in real-filesystem mount backends (ext4 / NTFS / FAT / … images, mkfs)
# via our `fstool` crate. Off by default — the mount table, in-memory root, and
# synthetic /proc + /dev need no external crate; only `--fs-type` / `--mount`
# of a real filesystem requires this. `default-features = false` drops the
# archive/compression codecs we don't use.
fstool = ["dep:fstool"]

# docs.rs builds with `trace` + `trace-exec` enabled so the
# trace-gated public items resolve in the rendered docs.
[package.metadata.docs.rs]
features = ["trace", "trace-exec"]

[dependencies]
thiserror = "2"
# Reuse the byte-identical NE (16-bit Windows) reader for the Win16
# loader (`ne` module): header, segment table, name / module-reference
# tables. Segment mapping + relocation live in `ne`.
ud-format = { version = "0.3.0", path = "../ud-format" }
# Read MSI compound-document tables for the in-emulator
# msiexec implementation under `win32::msiexec`. Read-only
# (open() takes Read+Seek; we feed it Cursor<&[u8]> over VFS
# bytes).
msi = "0.10"
# Decompress Windows .cab archives (LZX / MSZIP). The MSI's
# embedded `#name.cab` streams carry the actual file bodies
# that the install would write under Program Files; we pump
# the decompressed bytes through `win32::msiexec`'s
# WriteFile actions so the VFS dump has real content rather
# than zero-byte placeholders.
cab = "0.6"
# Serialize the headless Win16 GUI model (windows / dialogs / message
# boxes) to JSON so an external "expect"-style driver can observe and
# script a GUI program (e.g. an installer) non-interactively.
serde = { version = "1", features = ["derive"] }

# --- opt-in `kvm` feature only (see [features].kvm) ---
# Guest-memory mmap + munmap for the KVM backend.
libc = { version = "0.2", optional = true }
# rust-vmm safe wrappers over the /dev/kvm ioctl ABI.
kvm-ioctls = { version = "0.23", optional = true }
kvm-bindings = { version = "0.13", optional = true, features = ["fam-wrappers"] }
# Real on-disk filesystems (ext/NTFS/FAT/…) for the `fstool` mount backend.
# `gzip` is enabled so we can repack `.tar.gz` sources (Alpine minirootfs, `.apk`
# packages) into an ext4 root; the rest of fstool's archive/compression codecs
# stay off. 0.4.18 fixes ext rename in directories larger than one block
# (KarpelesLab/fstool#29), needed for `apk add git` and other big-dir packages.
fstool = { version = "0.4.35", optional = true, default-features = false, features = [
    # Since 0.4.35 the filesystem backends are opt-in; `filesystems` restores
    # the full set (ext4 for --rootfs, NTFS/FAT/… for --mount images).
    "filesystems",
    "gzip",
] }

[dev-dependencies]
# Fetched-fixture corpus runner (`tests/codec_corpus.rs`).
# Pulls codec DLLs from samples.oxideav.org with a local cache.
ureq = { version = "2", default-features = false, features = ["tls"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }


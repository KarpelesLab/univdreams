[package]
name = "ud-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The `ud` command-line driver for the univdreams suite."

[lints]
workspace = true

[[bin]]
name = "ud"
path = "src/main.rs"

[lib]
name = "ud_cli"
path = "src/lib.rs"

[dependencies]
ud-core = { version = "0.1.1", path = "../ud-core" }
ud-ast = { version = "0.1.1", path = "../ud-ast" }
ud-format = { version = "0.1.1", path = "../ud-format" }
ud-translate = { version = "0.1.1", path = "../ud-translate" }
ud-arch-codec = { version = "0.1.1", path = "../ud-arch-codec" }
ud-arch-x86 = { version = "0.1.1", path = "../ud-arch-x86" }
ud-arch-aarch64 = { version = "0.1.1", path = "../ud-arch-aarch64" }
ud-arch-6502 = { version = "0.1.1", path = "../ud-arch-6502" }
ud-arch-bpf = { version = "0.1.1", path = "../ud-arch-bpf" }
ud-emulator = { version = "0.1.1", path = "../ud-emulator" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
bs58 = "0.5"
base64 = "0.22"

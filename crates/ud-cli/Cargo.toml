[package]
name = "ud-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `ud` command-line driver for the univdreams suite."
publish = false

[lints]
workspace = true

[[bin]]
name = "ud"
path = "src/main.rs"

[lib]
name = "ud_cli"
path = "src/lib.rs"

[dependencies]
ud-core = { path = "../ud-core" }
ud-format-elf = { path = "../ud-format-elf" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

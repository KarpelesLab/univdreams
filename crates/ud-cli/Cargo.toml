[package]
name = "ud-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The `ud` command-line driver for the univdreams suite."

[lints]
workspace = true

[[bin]]
name = "ud"
path = "src/main.rs"

[lib]
name = "ud_cli"
path = "src/lib.rs"

[dependencies]
ud-core = { version = "0.1.0", path = "../ud-core" }
ud-ast = { version = "0.1.0", path = "../ud-ast" }
ud-format-elf = { version = "0.1.0", path = "../ud-format-elf" }
ud-format-pe = { version = "0.1.0", path = "../ud-format-pe" }
ud-format-macho = { version = "0.1.0", path = "../ud-format-macho" }
ud-format-raw = { version = "0.1.0", path = "../ud-format-raw" }
ud-translate = { version = "0.1.0", path = "../ud-translate" }
ud-emulator = { version = "0.1.0", path = "../ud-emulator" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
